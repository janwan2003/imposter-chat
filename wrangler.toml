name = "pb-imposter-chat"
main = "src/worker.js"
compatibility_date = "2025-11-01"
workers_dev = true
preview_urls = false

[assets]
directory = "public"
binding = "ASSETS"
html_handling = "auto-trailing-slash"
not_found_handling = "404-page"
run_worker_first = ["/api/*", "/g/*"]

[[durable_objects.bindings]]
name = "GAMES"
class_name = "Games"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Games"]

[observability]
enabled = false
