<!doctype html>
<html><head><meta charset="utf-8"><style>
body{margin:0;width:1200px;height:630px;font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:linear-gradient(135deg,#5b3df5,#8b5cf6);color:#fff;display:flex;overflow:hidden}
.l{padding:70px 0 0 80px;width:640px}
.logo{display:flex;align-items:center;gap:16px;font-weight:800;font-size:40px}
.logo img{width:64px;height:64px;border-radius:16px;box-shadow:0 6px 20px rgba(0,0,0,.2)}
h1{font-size:64px;line-height:1.05;letter-spacing:-.03em;margin:44px 0 20px}
p{font-size:28px;opacity:.9;margin:0}
.cards{position:relative;flex:1}
.c{position:absolute;width:210px;height:290px;border-radius:28px;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 20px 50px rgba(0,0,0,.25);text-align:center}
.c small{font-size:18px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;opacity:.8}
.c b{font-size:38px;font-weight:900;margin-top:8px}
.a{background:#fff;color:#1d1832;left:-20px;top:170px;transform:rotate(-10deg)}
.a small{color:#6b6580}
.b{background:#fff;color:#1d1832;left:110px;top:140px;transform:rotate(2deg)}
.b small{color:#6b6580}
.d{background:linear-gradient(140deg,#e5484d,#f97316);left:235px;top:170px;transform:rotate(12deg)}
</style></head><body>
<div class="l"><div class="logo"><img src="../public/icon.svg">Oddclue</div>
<h1>One of you doesn't know the word.</h1>
<p>The imposter word game for your group chat. Free, no app, no sign-up.</p></div>
<div class="cards"><div class="c a"><small>The word is</small><b>pancake</b></div><div class="c b"><small>The word is</small><b>pancake</b></div><div class="c d"><small>You are the</small><b>Imposter</b></div></div>
</body></html>
